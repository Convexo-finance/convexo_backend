[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Migrations run in the main container via start.sh (which HAS private-network access
# to postgres.railway.internal). The Railway preDeploy step does NOT have that access,
# so `preDeployCommand` for migrations fails with P1001 — do not reintroduce it here.
startCommand = "sh start.sh"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
overlapSeconds = 20
